name: Python tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp==1.30.0" "paramiko>=4.0,<5" "pywebview>=6.1,<7" "httpx>=0.28,<0.29" "cryptography>=46,<47"
      - name: Service-management regression
        run: python -m unittest discover -s tests -p 'test_service_ops.py' -v
      - name: Tunnel runtime concurrency regression
        run: timeout --signal=TERM --kill-after=5s 45s python -m unittest discover -s tests -p 'test_runtime.py' -v
      - name: Full Python suite (isolated modules)
        shell: bash
        run: |
          set -euo pipefail
          # Run each module in a fresh Python process so leaking threads or
          # mutated global state cannot hang unrelated tests silently.
          for test_file in tests/test_*.py; do
            echo "::group::$(basename "$test_file")"
            timeout --signal=TERM --kill-after=5s 90s python -m unittest discover \
              -s tests -p "$(basename "$test_file")" -v
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Frontend logic tests
        working-directory: frontend
        run: npm test
